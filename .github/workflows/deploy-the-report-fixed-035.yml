name: Deploy The Report

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: the-report-pages
  cancel-in-progress: true

jobs:
  build:
    name: Build site
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Build static Pages folder
        shell: bash
        run: |
          set -euo pipefail

          rm -rf _site _package_extract
          mkdir -p _site

          # Normal install: this ZIP has already been unzipped into the repo root.
          # Backup install: if the package ZIP is committed in the repo root, deploy from it.
          PACKAGE_ZIP=""
          for candidate in the_report_clean_neon_035.zip the_report_clean_neon_034.zip the_report_neon_backroom_total_032_package.zip; do
            if [ -f "$candidate" ]; then
              PACKAGE_ZIP="$candidate"
              break
            fi
          done

          if [ -f index.html ]; then
            echo "Deploying from repository root."
            rsync -a ./ _site/ \
              --exclude ".git" \
              --exclude ".github" \
              --exclude "_site" \
              --exclude "_package_extract" \
              --exclude "*.zip"
          elif [ -n "$PACKAGE_ZIP" ]; then
            echo "index.html not found at repo root. Extracting $PACKAGE_ZIP."
            unzip -o "$PACKAGE_ZIP" -d _package_extract
            if [ -f "_package_extract/index.html" ]; then
              rsync -a _package_extract/ _site/ --exclude ".github" --exclude "*.zip"
            elif [ -f "_package_extract/the_report_neon_backroom_total_032/index.html" ]; then
              rsync -a _package_extract/the_report_neon_backroom_total_032/ _site/ --exclude ".github" --exclude "*.zip"
            else
              echo "ERROR: No index.html found in repo root or package ZIP."
              find _package_extract -maxdepth 4 -type f | sort
              exit 1
            fi
          else
            echo "ERROR: No index.html found and no package ZIP found."
            exit 1
          fi

          test -f _site/index.html
          echo "index.html ready for deploy."

          if [ -d _site/assets/characters/npcs/neon_nights ]; then
            echo "Neon Nights sprites included:"
            find _site/assets/characters/npcs/neon_nights -maxdepth 1 -type f -name '*.png' | sort | wc -l
          else
            echo "WARNING: Neon Nights sprite folder not found in deploy output."
          fi

          if [ -f _site/assets/audio/music/red_curtain_heat.mp3 ]; then
            echo "Red Curtain Heat included."
          else
            echo "WARNING: Red Curtain Heat mp3 not found in deploy output."
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    needs: build

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy Pages artifact
        id: deployment
        uses: actions/deploy-pages@v4
