name: Deploy The Report

on:
  workflow_dispatch:
    inputs:
      deploy_source:
        description: "Deploy source"
        required: true
        default: "auto"
        type: choice
        options:
          - auto
          - repo-root
          - neon-032-zip
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: the-report-pages
  cancel-in-progress: true

jobs:
  build:
    name: Build Pages artifact
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          lfs: true

      - name: Prepare static site
        shell: bash
        run: |
          set -euo pipefail

          rm -rf _site _deploy_pkg
          mkdir -p _site

          DEPLOY_SOURCE="${{ github.event.inputs.deploy_source || 'auto' }}"
          PACKAGE_ZIP="the_report_neon_backroom_total_032_package.zip"

          echo "Deploy source: ${DEPLOY_SOURCE}"

          if { [ "${DEPLOY_SOURCE}" = "auto" ] || [ "${DEPLOY_SOURCE}" = "neon-032-zip" ]; } && [ -f "${PACKAGE_ZIP}" ]; then
            echo "Installing from ${PACKAGE_ZIP}"
            unzip -o "${PACKAGE_ZIP}" -d _deploy_pkg

            if [ -f "_deploy_pkg/the_report_neon_backroom_total_032/index.html" ]; then
              cp -a _deploy_pkg/the_report_neon_backroom_total_032/. _site/
            elif [ -f "_deploy_pkg/index.html" ]; then
              cp -a _deploy_pkg/. _site/
            else
              echo "ERROR: ZIP did not contain index.html in an expected location."
              find _deploy_pkg -maxdepth 3 -type f | sort
              exit 1
            fi
          else
            echo "Installing from repo root"
            rsync -a ./ _site/ \
              --exclude ".git" \
              --exclude ".github" \
              --exclude "_site" \
              --exclude "_deploy_pkg"
          fi

          test -f _site/index.html
          echo "index.html found in deploy artifact"

          if grep -q "NeonNightsInteriorScene\|NEON_BACKROOM_AND_SCALE_FIX_HOTFIX_031\|NEON_NIGHTS_WORKFLOW_HOTFIX_030" _site/index.html; then
            echo "Neon Nights code found"
          else
            echo "WARNING: Neon Nights code not found in deployed index.html"
          fi

          if [ -d _site/assets/characters/npcs/neon_nights ]; then
            echo "Neon Nights sprites found:"
            find _site/assets/characters/npcs/neon_nights -maxdepth 1 -type f | sort
          else
            echo "WARNING: Neon Nights sprite folder missing from deploy artifact"
          fi

          if [ -f _site/assets/audio/music/red_curtain_heat.mp3 ]; then
            echo "Red Curtain Heat found"
          else
            echo "WARNING: Red Curtain Heat missing from deploy artifact"
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    needs: build

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy artifact
        id: deployment
        uses: actions/deploy-pages@v4
